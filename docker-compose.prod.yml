services:
  productions:
    build:
      context: .
    container_name: ms-eventomax-productions
    mem_limit: 640m
    expose:
      - "8080"
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_SCHEMA: ${DB_SCHEMA:-productions}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${DB_SCHEMA:-productions}
      SPRING_FLYWAY_SCHEMAS: ${DB_SCHEMA:-productions}
      SPRING_FLYWAY_CREATE_SCHEMAS: ${FLYWAY_CREATE_SCHEMAS:-true}
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:?CATALOG_BASE_URL is required}
      SPRING_RABBITMQ_ADDRESSES: ${SPRING_RABBITMQ_ADDRESSES:-rabbitmq-1:5672,rabbitmq-2:5672}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq-1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:?ENTRA_ISSUER_URI is required}
      ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?ENTRA_AUDIENCE is required}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      KAFKA_TOPIC_PRODUCTIONS: ${KAFKA_TOPIC_PRODUCTIONS:-productions.events}
      KAFKA_OUTBOX_RELAY_ENABLED: ${KAFKA_OUTBOX_RELAY_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - eventomax-net
    restart: unless-stopped

networks:
  eventomax-net:
    external: true
