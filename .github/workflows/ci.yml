name: CI

on:
  push:
    branches: ["main", "develop", "fix/**", "feature/**"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
