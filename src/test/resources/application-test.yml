spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  rabbitmq:
    host: 127.0.0.1
    port: 19098
    username: test
    password: test
  kafka:
    bootstrap-servers: 127.0.0.1:19099
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.invalid/test
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eventomax:
  outbox:
    poll-delay-ms: 3600000
    initial-delay-ms: 3600000
  security:
    jwt:
      audience: productions-test
  clients:
    catalog:
      base-url: http://127.0.0.1:19097
