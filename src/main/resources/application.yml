spring:
  application:
    name: ms-eventomax-productions
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false
    admin:
      auto-create: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eventomax:
  security:
    jwt:
      audience: ${ENTRA_AUDIENCE}
  kafka:
    topic:
      productions: ${KAFKA_TOPIC_PRODUCTIONS:productions.events}
  outbox:
    relay:
      enabled: ${KAFKA_OUTBOX_RELAY_ENABLED:true}
  clients:
    catalog:
      base-url: ${CATALOG_BASE_URL}
  messaging:
    email:
      default-recipient: ${EVENTOMAX_DEFAULT_RECIPIENT_EMAIL:}
    rabbitmq:
      exchange: cmd.direct
      routing-key:
        email: email.send
        crew: crew.ticket
        quote: quote.gen
  graph:
    enabled: ${EVENTOMAX_GRAPH_ENABLED:false}
    tenant-id: ${EVENTOMAX_GRAPH_TENANT_ID:}
    client-id: ${EVENTOMAX_GRAPH_CLIENT_ID:}
    client-secret: ${EVENTOMAX_GRAPH_CLIENT_SECRET:}
    service-principal-id: ${EVENTOMAX_GRAPH_SERVICE_PRINCIPAL_ID:}
    organizer-app-role-id: ${EVENTOMAX_GRAPH_ORGANIZER_ROLE_ID:}
    connect-timeout: ${EVENTOMAX_GRAPH_CONNECT_TIMEOUT:3s}
    read-timeout: ${EVENTOMAX_GRAPH_READ_TIMEOUT:5s}
    cache-ttl: ${EVENTOMAX_GRAPH_CACHE_TTL:5m}
    max-pages: ${EVENTOMAX_GRAPH_MAX_PAGES:10}
